packageName: managementv1
packageVersion: 1.0.0

# Embed the generated code inside the existing module instead of producing a
# standalone Go SDK. Skips go.mod/go.sum/README emission and uses package-local
# imports.
withGoMod: false
isGoSubmodule: true

# Polymorphism / oneOf handling. Lakekeeper's storage profile and credential
# types are oneOf unions; the discriminator lookup makes them ergonomic.
useOneOfDiscriminatorLookup: true

# Prefix enum constants with their type name (e.g. `S3FLAVOR_AWS`). Without
# the prefix, values shared across enums (`create`, `delete`, `select` in the
# various `*Action` enums) collide as package-level constants.
enumClassPrefix: true

# Drop per-leaf-struct MarshalJSON. The default Go encoder on the struct's
# json tags produces byte-identical wire format (each optional field carries
# `omitempty`), and the oneOf/Nullable wrappers' MarshalJSON come from
# different templates and are unaffected. Saves ~8 lines per model file.
generateMarshalJSON: false

# Keep per-leaf-struct UnmarshalJSON. It enforces required-property presence on
# inbound responses (catching a server that drops a field clients depend on),
# which is also what lets unions without a discriminator in the spec (e.g.
# NamespaceIdentOrUuid, SubtreeGrantPrincipal) pick the one matching variant.
# Its one undesirable side effect —
# strict decoding via decoder.DisallowUnknownFields(), which rejects responses
# carrying a field the SDK's spec doesn't know about — is the wrong posture for a
# client library (Lakekeeper adds fields between releases, e.g. latest-main's
# `allowed-format-versions` on the warehouse object after v0.12.3). The
# `api/openapi/postprocess` step in `make generate` strips those
# DisallowUnknownFields() calls after generation, so additive server fields are
# tolerated while the required-property check and discriminator dispatch remain.
# Unions decode by discriminator (enum) or required-field presence — neither
# depends on strict unknown-field rejection. See docs/GENERATION.md.
generateUnmarshalJSON: true

# Keep the file footprint small — we expose the generated client through the
# pkg/client facade, so the additional XxxAPIService interface variants are not
# needed.
generateInterfaces: false

# Hidden files openapi-generator drops next to the output. Committed so that
# regeneration produces a stable diff.
gitUserId: lakekeeper
gitRepoId: go-lakekeeper
