

name: nightly

on:
  schedule:
    - cron: '0 2 * * *'

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

# Testing only needs permissions to read the repository contents.
permissions:
  contents: read

# Nightly runs against the newest golangci-lint, kind, helm, and Lakekeeper
# chart to catch breakage before Renovate proposes the bump; PR CI uses
# pinned versions.
jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod

      - run: go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest run ./...

  tests:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod

      - run: GOPATH=$(go env GOPATH) make test

      - run: GOPATH=$(go env GOPATH) LAKEKEEPER_VERSION=latest-main make test-integration
        timeout-minutes: 10

      - run: GOPATH=$(go env GOPATH) LAKEKEEPER_VERSION=latest-main make test-e2e-compose
        timeout-minutes: 15

      # kind-action interpolates `version` into the release download URL and
      # has no notion of `latest`, so resolve the tag first.
      - name: resolve latest kind version
        id: kind-version
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "version=$(gh release view --repo kubernetes-sigs/kind --json tagName --jq .tagName)" >> "$GITHUB_OUTPUT"

      - name: setup kind
        uses: helm/kind-action@1544676c07bb3570fcb70166beaa07c4528fd4aa # v1.15.1
        with:
          version: ${{ steps.kind-version.outputs.version }}
          install_only: true

      - name: setup helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
        with:
          version: latest

      - run: GOPATH=$(go env GOPATH) LAKEKEEPER_CHART_VERSION=latest make test-e2e-kind
        timeout-minutes: 20

  # Schedule-failure emails only reach whoever last edited the cron, so
  # surface failures as a GitHub issue instead.
  report-failure:
    needs: [lint, tests]
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: open or update nightly-failure issue
        run: |
          gh label create nightly-failure --color B60205 \
            --description "Nightly workflow failed" 2>/dev/null || true
          body="Nightly run failed: $RUN_URL"
          issue=$(gh issue list --label nightly-failure --state open --limit 1 --json number --jq '.[0].number')
          if [ -n "$issue" ]; then
            gh issue comment "$issue" --body "$body"
          else
            gh issue create --title "Nightly workflow failed" --label nightly-failure --body "$body"
          fi
